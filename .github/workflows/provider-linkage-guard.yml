name: Provider direct-linkage guard

# Reusable-workflow caller: see the header comment in nousergon/nousergon-lib's
# own provider-linkage-guard.yml for the full rationale. Wired here by the
# fleet coverage rollout (alpha-engine-config-I9295). Measured 2026-10-30
# against this repo's main with --include-dist: 0 matches, so it carries no
# .provider-linkage-allowlist.yaml. A future direct provider linkage fails
# this check from day one instead of going undetected.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@8951979b9fe67274f9fc25241dc3289236e3cd03
